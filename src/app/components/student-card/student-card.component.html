<div class="card shadow-4 " style="width: 18rem; min-height: 430px">
  <div class="d-flex justify-content-center mt-3">
    <img src="{{image}}" class="rounded-circle card-img w-75" alt="...">
  </div>
  <div class="position-relative card-body">
    <h5 class="card-title">{{name}} {{lastNames}}</h5>
    <div class="position-absolute position-button d-flex gap-2 justify-content-center">
      <button
        class="btn btn-lg btn-success"
        routerLink="['']"
      > VER PERFIL</button>
      <button
        *ngIf="authService.getRole() === 1"
        (click)="deactivateStudent(id)"
        class="btn btn-lg btn-success"
      > DAR BAJA</button>
    </div>
  </div>
</div>
