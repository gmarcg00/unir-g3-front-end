<header>
  <div class="logo">
    <a [routerLink]="['/home']">
      <img src="/public/images/logos/hogwarts-logo.png" alt="Hogwarts Logo" id="hogwarts-logo" />
    </a>
  </div>
  <div class="header-content">
    <h1>Howards Profesores</h1>
  </div>
  <div class="menu-icon" id="menu-icon">☰</div>
  <nav id="nav-menu">
    <ul>
      <div *ngIf="actualRole === 0" class="d-flex">
        <!-- USER NOT LOGGED -->
        <li>
          <a [routerLink]="['/como-funciona']">Como funciona</a>
        </li>
        <li>
          <a [routerLink]="['/sign-up']">Empieza ya</a>
        </li>
        <li>
          <a [routerLink]="['/login']">Entrar</a>
        </li>
      </div>
      <div *ngIf="actualRole === 1" class="d-flex">
        <!-- ADMIN ROLE-->
        <li>
          <a [routerLink]="['/admin/student-list']">Listado de alumnos</a>
        </li>
        <li>
          <a [routerLink]="['/admin/activate-teachers']">Profesores en espera</a>
        </li>
        <li>
          <a [routerLink]="['/home']" (click)="signOut()">Salir</a>
        </li>
      </div>
    </ul>
  </nav>
</header>
