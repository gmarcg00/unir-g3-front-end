<header>
  <div class="logo"><a [routerLink]="['/home']">Busca Profe</a></div>
  <div class="menu-icon" id="menu-icon">&#9776;</div>
  <nav id="nav-menu">
    <ul>
      <div *ngIf="actualRole === 0" class="d-flex">
        <!-- USER NOT LOGGED -->
        <li>
          <a [routerLink]="['/como-funciona']">
            Como funciona
          </a>
        </li>
        <li>
          <a [routerLink]="['/sign-up']">
            Empieza ya
          </a>
        </li>
      </div>
      <div *ngIf="actualRole === 1" class="d-flex">
        <!-- ADMIN ROLE-->
        <li>
          <a [routerLink]="['/admin/student-list']">
            Listado de alumnos
          </a>
        </li>
        <li>
          <a [routerLink]="['/admin/activate-teachers']">
            Profesores en espera
          </a>
        </li>
        <li>
          <a [routerLink]="['/home']" (click)="signOut()">
            Salir
          </a>
        </li>
        <li class="pointer">
          <svg [routerLink]="['/profile']" xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor"
            class="bi bi-person" viewBox="0 0 16 16">
            <path
              d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6m2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0m4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4m-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10s-3.516.68-4.168 1.332c-.678.678-.83 1.418-.832 1.664z" />
          </svg>
        </li>
      </div>
      <div *ngIf="actualRole === 2" class="d-flex">
        <!-- TEACHER ROLE-->
        <li>
          <a [routerLink]="['/dashboard/teacher']">
            Ver alumnos
          </a>
        </li>
        <li>
          <a [routerLink]="['/home']" (click)="signOut()">
            Salir
          </a>
        </li>
        <li class="pointer">
          <svg [routerLink]="['/profile']" xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor"
            class="bi bi-person" viewBox="0 0 16 16">
            <path
              d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6m2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0m4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4m-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10s-3.516.68-4.168 1.332c-.678.678-.83 1.418-.832 1.664z" />
          </svg>
        </li>
      </div>
      <div *ngIf="actualRole === 3" class="d-flex">
        <!-- STUDENT ROLE-->
        <li>
          <a [routerLink]="['/teachers']">
            Buscar profesores
          </a>
        </li>
        <li>
          <a [routerLink]="['/home']" (click)="signOut()">
            Salir
          </a>
        </li>
        <li class="pointer">
          <svg [routerLink]="['/profile']" xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor"
            class="bi bi-person" viewBox="0 0 16 16">
            <path
              d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6m2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0m4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4m-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10s-3.516.68-4.168 1.332c-.678.678-.83 1.418-.832 1.664z" />
          </svg>
        </li>
      </div>
    </ul>
  </nav>
</header>

<script>
  document.getElementById('menu-icon').addEventListener('click', function () {
    const navMenu = document.getElementById('nav-menu');
    navMenu.classList.toggle('active'); // Alternar la clase 'active' al hacer clic
  });
</script>
