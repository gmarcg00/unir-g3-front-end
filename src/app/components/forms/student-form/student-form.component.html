<form
  [formGroup]="modelForm"
  (ngSubmit)="signUp()"
  class="d-flex flex-column p-3 w-100  shadow"
>
  <div class="my-2">
    <label for="name" class="form-label">Nombre</label>
    <input type="text" id="name" class="form-control" formControlName="name" />
  </div>
  <button
    type="submit"
    class="btn btn-success my-2 btn-lg mx-auto"
    [disabled]="!modelForm.valid"
  >
    REGISTRARSE
  </button>
  <p class="switch-form">¿Ya tienes una cuenta? <a [routerLink]="['/sign-in']" id="show-teacher-register">Inicia sesión</a></p>
</form>
