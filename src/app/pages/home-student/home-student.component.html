<div class="d-flex flex-column justify-content-center align-items-center app-bg">
  <section class="d-flex flex-column gap-2 my-2 w-100 text-white shadow">
    <div class="px-4">
      <hr />
      <h2 class="text-center text-white py-1 mb-0">ESTOS SON TUS MAESTROS Y MAESTRAS</h2>
      <hr />
    </div>
      <div class="d-flex flex-row justify-content-center flex-wrap px-3 pb-2 gap-3">
          <div *ngFor="let teacher of myTeachers">
              <app-teacher-card [id]="teacher.id" [name]="teacher.name" [lastNames]="teacher.last_names"
                                [knowledgeBranches]="teacher.knowledge_branches" [price]="teacher.price_hour"
                                [image]="teacher.image || 'assets/images/default-teacher.png'" [isValorable]="true"  class="h-100">
              </app-teacher-card>
          </div>
      </div>
  </section>

  <!-- Best Rated Teachers Section -->
  <section class="d-flex flex-column gap-2 my-2 w-100 text-white shadow">
    <div class="px-4">
      <hr />
      <h2 class="text-center py-1 mb-0">ENCUENTRA A LOS MEJORES MAGOS Y BRUJAS</h2>
      <hr />
    </div>
    <div class="d-flex flex-row justify-content-center align-items-center px-3 pb-2">
      <div class="">
        <div class="d-flex flex-wrap justify-content-center align-items-center gap-2 mb-4" style="min-height:450px">
          <div *ngFor="let teacher of teachers">
            <app-teacher-card [id]="teacher.id" [name]="teacher.name" [lastNames]="teacher.last_names"
                              [knowledgeBranches]="teacher.knowledge_branches" [price]="teacher.price_hour" [isContactable]="true"
                              [image]="teacher.image || 'assets/images/default-teacher.png'" class="h-100">
            </app-teacher-card>
          </div>
        </div>
        <div class="d-flex justify-content-center my-3">
          <a class="btn btn-success btn-lg text-white px-5 border-2 border-black" [routerLink]="['/teachers']"
             aria-label="Ver todos los profesores">
            VER TODOS
          </a>
        </div>
      </div>

    </div>
  </section>
</div>
