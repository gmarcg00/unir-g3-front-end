<div class="d-flex flex-column justify-content-center align-items-center app-bg">

  <section class="d-flex flex-column gap-2 my-2 w-100 text-white shadow">
    <div class="px-4">
      <hr />
      <h2 class="text-center text-white py-1 mb-0">ESTOS SON TUS MAESTROS Y MAESTRAS</h2>
      <hr />
    </div>
      <div class="d-flex flex-row px-3 pb-2">
          <div *ngFor="let teacher of myTeachers">
              <app-teacher-card [id]="teacher.id" [name]="teacher.name" [lastNames]="teacher.last_names"
                                [knowledgeBranches]="teacher.knowledge_branches" [price]="teacher.price_hour"
                                [image]="teacher.image || 'assets/images/default-teacher.png'" class="h-100">
              </app-teacher-card>
          </div>
      </div>
      <div class="d-flex justify-content-center my-3">
          <a class="btn btn-success btn-lg text-white px-5 border-2 border-black" [routerLink]="['/teachers']"
             aria-label="Ver todos los profesores">
              VER TODOS
          </a>
      </div>
  </section>

  <!-- Best Rated Teachers Section -->
  <section class="d-flex flex-column gap-2 my-2 w-100 text-white shadow">
    <div class="px-4">
      <hr />
      <h2 class="text-center py-1 mb-0">ENCUENTRA A LOS MEJORES MAGOS Y BRUJAS</h2>
      <hr />
    </div>
    <div class="d-flex flex-row px-3 pb-2">
      <div class="d-flex flex-column gap-2 w-50 h-100 px-2">
        <div class="" style="max-height: 60%">
          <app-map [range]="distance" aria-label="Mapa de profesores cercanos"></app-map>
        </div>
        <div class="d-flex flex-column gap-3 h-100 text-center py-2 px-2" style="min-height: 40%">
          <h4>AGITA TU VARITA PARA SELECCIONA TUS PREFERENCIAS</h4>
          <div class="d-flex flex-row gap-3 w-100">
            <div class="d-flex justify-content-center align-items-center">
              <h6 class="mb-0">Selecciona el radio de búsqueda</h6>
            </div>
            <div class="dropdown">
              <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false"
                      aria-label="Seleccionar distancia">
                {{ distance }} KM
              </button>
              <ul class="dropdown-menu" role="menu">
                <li><a class="dropdown-item" (click)="selectDistance(1)" role="menuitem">1 KM</a></li>
                <li><a class="dropdown-item" (click)="selectDistance(2)" role="menuitem">2 KM</a></li>
                <li><a class="dropdown-item" (click)="selectDistance(5)" role="menuitem">5 KM</a></li>
                <li><a class="dropdown-item" (click)="selectDistance(10)" role="menuitem">10 KM</a></li>
                <li><a class="dropdown-item" (click)="selectDistance(20)" role="menuitem">20 KM</a></li>
                <li><a class="dropdown-item" (click)="selectDistance(30)" role="menuitem">30 KM</a></li>
              </ul>
            </div>
          </div>
        </div>
      </div>
      <div class="w-50 px-2">
        <div class="d-flex flex-wrap justify-content-center gap-2 mb-4" style="min-height:450px">
          <div *ngIf="isLoading" class="d-flex justify-content-center align-items-center" aria-live="polite">
            <div class="spinner-border" role="status" style="width: 5rem; height: 5rem;">
              <span class="visually-hidden">Cargando profesores...</span>
            </div>
          </div>
          <div *ngFor="let teacher of teachers">
            <app-teacher-card [id]="teacher.id" [name]="teacher.name" [lastNames]="teacher.last_names"
                              [knowledgeBranches]="teacher.knowledge_branches" [price]="teacher.price_hour"
                              [image]="teacher.image || 'assets/images/default-teacher.png'" class="h-100">
            </app-teacher-card>
          </div>
        </div>
        <div class="d-flex justify-content-center my-3">
          <a class="btn btn-success btn-lg text-white px-5 border-2 border-black" [routerLink]="['/teachers']"
             aria-label="Ver todos los profesores">
            VER TODOS
          </a>
        </div>
      </div>

    </div>
  </section>
</div>
