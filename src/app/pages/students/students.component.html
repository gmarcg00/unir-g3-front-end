<div class="d-flex flex-column gap-4 justify-content-center align-items-center">
  <div class="d-flex flex-column justify-content-sm-start w-100 pt-3">
    <h2 class="m-0">LISTADO DE ALUMNOS</h2>
    <hr />
  </div>
  <div class="d-flex flex-wrap justify-content-center gap-3">
    <div *ngFor="let student of students">
      <app-student-card
        [id]="student.id"
        [name]="student.name"
        [lastNames]="student.last_names"
        [image]="student.image"
      >
      </app-student-card>
    </div>
  </div>
  <div>
    <nav aria-label="Page navigation example">
      <ul class="pagination">
        <!-- Botón "Anterior" -->
        <li
          class="page-item"
          [class.disabled]="currentPage === 1"
          (click)="changePage(currentPage - 1)">
          <a class="page-link pointer">Previous</a>
        </li>

        <!-- Botones de páginas -->
        <li
          class="page-item"
          *ngFor="let page of pages"
          [class.active]="page === currentPage"
          (click)="changePage(page)">
          <a class="page-link pointer">{{ page }}</a>
        </li>

        <!-- Botón "Siguiente" -->
        <li
          class="page-item"
          [class.disabled]="currentPage === totalPages"
          (click)="changePage(currentPage + 1)">
          <a class="page-link pointer">Next</a>
        </li>
      </ul>
    </nav>
  </div>
</div>
