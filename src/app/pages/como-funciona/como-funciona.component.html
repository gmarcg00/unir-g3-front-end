<div class="funciona-container">
  <h1>Cómo funciona</h1>
  <h2>↓ Una guía sencilla para entender nuestro proceso paso a paso ↓</h2>

  <!-- Bucle para mostrar cada paso del funcionamiento -->
  <div class="paso-funcionamiento" *ngFor="let item of pasosFuncionamiento">
    <h3>{{ item.paso }}</h3>
    <p>{{ item.descripcion }}</p>
  </div>
</div>
