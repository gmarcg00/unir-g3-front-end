<div class="d-flex flex-column justify-content-center align-items-center text-center testimonios-container">
  <h1>Lo que dicen nuestros estudiantes</h1>
  <div class="d-flex flex-row flex-wrap justify-content-center align-items-center w-100 gap-4 pb-5">
    <div *ngFor="let testimonio of testimonios">
      <app-testimony-card
        [name]="testimonio.nombre"
        [image]="testimonio.ruta"
        [content]="testimonio.mensaje"
      ></app-testimony-card>
    </div>
  </div>
</div>
