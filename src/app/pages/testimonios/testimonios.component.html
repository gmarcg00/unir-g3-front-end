<div class="testimonios-container">
  <h1>Lo que dicen nuestros estudiantes</h1>

  <!-- Bucle para mostrar cada testimonio -->
  <div class="testimonio" *ngFor="let testimonio of testimonios">
    <div class="testimonio-imagen">
      <img src="{{ testimonio.ruta }}" alt="Estudiante" width="100" height="100" />
    </div>

    <div class="testimonio-texto">
      <h3>{{ testimonio.nombre }}</h3>
      <p>{{ testimonio.mensaje }}</p>
    </div>
  </div>
</div>
