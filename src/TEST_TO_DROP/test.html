<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valoración del Profesor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .dialog-container {
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
            border: 2px solid #000;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .profile-circle {
            width: 80px;
            height: 80px;
            border: 2px solid #000;
            border-radius: 50%;
            background-color: #f8f9fa;
        }

        .slider-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 20px;
        }

        .btn-cancel {
            border: 2px solid orange;
            color: orange;
        }

        .btn-cancel:hover {
            background-color: orange;
            color: white;
        }

        .btn-save {
            border: 2px solid orange;
            background-color: orange;
            color: white;
        }

        .btn-save:hover {
            background-color: darkorange;
        }

        .note-box {
            width: 50px;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="dialog-container bg-white">
        <h5 class="text-center">VALORACIÓN DEL PROFESOR</h5>
        <div class="d-flex align-items-center my-3">
            <div class="profile-circle"></div>
            <div class="ms-3">
                <p class="mb-0">NOMBRE</p>
                <p>APELLIDOS</p>
            </div>
        </div>

        <div class="slider-container">
            <label for="rating-slider">Tu valoración</label>
            <input type="range" class="form-range" id="rating-slider">
            <input type="text" class="form-control note-box" id="rating-value" value="5" readonly>
        </div>

        <div class="mt-3">
            <label for="previous-feedback" class="form-label">Campo texto + valoración anterior</label>
            <textarea class="form-control" id="previous-feedback" rows="3"></textarea>
        </div>

        <div class="d-flex justify-content-between mt-4">
            <button class="btn btn-cancel">CANCELAR</button>
            <button class="btn btn-save">GUARDAR</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
